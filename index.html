<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VIRTUEL V11 BAM - SANS CAPTURE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial;padding:0;padding-bottom:20px}
.top{padding:14px;text-align:center;background:linear-gradient(180deg,#0a2a00,#000);border-bottom:2px solid #00c853;position:sticky;top:0;z-index:10}
.top h1{font-size:28px;margin:0;color:#00ff88}
.top p{color:#ffcc00;font-size:11px;margin:4px 0 0;font-weight:900}
.card{margin:12px;background:linear-gradient(180deg,#0a2a00,#0a0a0a);border:2px solid #00c853;border-radius:20px;padding:14px}
label{font-size:13px;color:#ffcc00;font-weight:900;display:block;margin:10px 0 6px}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #444;background:#111;color:#fff;font-size:15px}
.match-box{background:#111;border:1px solid #333;border-radius:14px;padding:12px;margin-bottom:10px}
.match-box b{color:#00ff88;font-size:14px}
.row2{display:flex;gap:6px;margin-top:8px}
.row2 select{flex:1}
.row3{display:flex;gap:6px;margin-top:8px}
.row3 input{flex:1;text-align:center;font-weight:900;font-size:16px;padding:12px}
.row3 input::placeholder{font-weight:400;font-size:12px}
.btn-bam{width:100%;background:#00ff88;color:#000;padding:18px;border:0;border-radius:14px;font-weight:900;font-size:22px;margin-top:10px}
.ticket{background:#001a0a;border:2px solid #00ff88;border-radius:16px;padding:14px;margin-top:12px;display:none}
.ticket h3{margin:0 0 10px;color:#00ff88;font-size:16px}
.ticket-row{background:#111;border-radius:12px;padding:12px;margin-bottom:8px}
.ticket-row b{font-size:15px}
.ticket-row span{color:#00ff88;font-weight:900}
.risque{color:#ff1744 !important}
.total-box{background:#ffcc00;color:#000;border-radius:12px;padding:14px;text-align:center;font-weight:900;margin-top:10px}
.total-box span{font-size:28px}
.conf-detail{background:#111;border:1px solid #333;border-radius:10px;padding:10px;font-size:12px;line-height:1.8;text-align:left;margin-top:10px}
.conf-detail b{color:#ffcc00}
.small{font-size:11px;color:#aaa;text-align:center;margin-top:8px;line-height:1.5}
.btn-copy{width:100%;background:#ffcc00;color:#000;padding:14px;border:0;border-radius:12px;font-weight:900;font-size:16px;margin-top:8px}
.journal{margin:12px;background:#0a0a0a;border:2px solid #333;border-radius:20px;padding:14px}
.journal h2{font-size:16px;margin:0 0 10px;color:#00ff88}
.j-grid{display:flex;gap:8px}.j-grid>div{flex:1;background:#111;padding:12px;border-radius:12px;text-align:center}
.j-num{font-size:24px;font-weight:900}
.btn-valider{width:100%;background:#007bff;color:#fff;padding:14px;border:0;border-radius:12px;font-weight:900;font-size:16px;margin-top:10px}
.btn-effacer{width:100%;background:#ff1744;color:#fff;padding:14px;border:0;border-radius:12px;font-weight:900;font-size:16px;margin-top:8px}
</style>
</head>
<body>
<div class="top">
<h1>⚡ VIRTUEL V11 BAM</h1>
<p>PAS DE CAPTURE - PAS D'ATTENTE - TU TAPES, BAM RÉSULTAT</p>
</div>

<div class="card">
<label>💰 TA MISE (MGA)</label>
<input type="number" id="miseInput" value="5000" inputmode="numeric">

<div id="matchs"></div>

<button class="btn-bam" onclick="genererBAM()">⚡ BAM - CALCULER MON TICKET</button>

<div class="ticket" id="ticketBox">
<h3>🎫 TON TICKET - TOP 3 BAM</h3>
<div id="ticketList"></div>
<div class="total-box">COTE COMBINÉE<br><span id="coteTotale">-</span><br><div style="font-size:14px" id="gainPotentiel">-</div><div style="font-size:12px;margin-top:6px" id="chanceCombinee"></div></div>
<div class="conf-detail" id="ticketDetail"></div>
<div class="conf-detail" id="tousMatchs"></div>
</div>
<button class="btn-copy" id="btnCopy" style="display:none" onclick="copierTicket()">📋 COPIER MON TICKET</button>
</div>

<div class="journal">
<h2>📓 Journal</h2>
<div class="j-grid"><div><div class="small">Total</div><div class="j-num" id="totalTrades">0</div></div><div><div class="small">Win Rate</div><div class="j-num" style="color:#00ff88" id="winRate">0%</div></div></div>
<select id="resultat" style="margin-top:10px"><option value="WIN">✅ WIN</option><option value="LOSS">❌ LOSS</option></select>
<button class="btn-valider" onclick="validerResultat()">✅ Valider Ticket</button>
<button class="btn-effacer" onclick="effacerJournal()">🗑️ Effacer</button>
<p class="small" id="listeTrades" style="margin-top:10px;text-align:left">Aucun pari.</p>
</div>
<p class="small">V11 = Plus de capture. Tu lis les cotes sur Bet261, tu les tapes ici, BAM. 5 secondes.<br>18+ Joue responsable. Virtuel = Hasard.</p>

<script>
let equipes=["Liverpool","London Reds","London Blues","Man Blue","Man Red","Spurs","Wolverhampton","Everton","West Ham","A. Villa","Leeds","Bournemouth","Burnley","Sunderland","Brighton","C. Palace","Fulham","Newcastle","N. Forest","Brentford","Chelsea","Arsenal"];
let dernierTicketText="", miseDefaut=5000, dernierTableau=null;
let trades=JSON.parse(localStorage.getItem('virtuel_v11_trades')||"[]");
function majJournal(){let t=trades.length;let w=trades.filter(x=>x.res==="WIN").length;let wr=t?Math.round(w/t*100):0;document.getElementById('totalTrades').innerText=t;document.getElementById('winRate').innerText=wr+"%";document.getElementById('listeTrades').innerHTML=t?trades.slice(-5).reverse().map(x=>`${x.pari} - ${x.res}`).join("<br>"):"Aucun pari.";}
majJournal();
function validerResultat(){if(!dernierTicketText){alert("Calcule d'abord ton ticket !");return;}let res=document.getElementById('resultat').value;trades.push({pari:dernierTicketText,res:res});localStorage.setItem('virtuel_v11_trades',JSON.stringify(trades));majJournal();alert("Validé : "+res);}
function effacerJournal(){if(confirm("Effacer ?")){trades=[];localStorage.removeItem('virtuel_v11_trades');majJournal();}}
function copierTicket(){if(!dernierTicketText){alert("Calcule d'abord !");return;}navigator.clipboard.writeText(dernierTicketText).then(()=>alert("Copié !\n"+dernierTicketText));}

// On crée 5 matchs vides, tu remplis juste ceux que tu vois sur Bet261
let htmlMatchs="";
for(let i=1;i<=5;i++){
  let opts=equipes.map(e=>`<option value="${e}">${e}</option>`).join("");
  htmlMatchs+=`<div class="match-box"><b>MATCH ${i}</b><div class="row2"><select id="dom${i}"><option value="">Domicile...</option>${opts}</select><select id="ext${i}"><option value="">Extérieur...</option>${opts}</select></div><div class="row3"><input id="c1_${i}" placeholder="Cote 1" inputmode="decimal"><input id="cx_${i}" placeholder="Cote X" inputmode="decimal"><input id="c2_${i}" placeholder="Cote 2" inputmode="decimal"></div></div>`;
}
document.getElementById('matchs').innerHTML=htmlMatchs;

function genererBAM(){
  miseDefaut=parseInt(document.getElementById('miseInput').value)||5000;
  let tableau=[];
  for(let i=1;i<=5;i++){
    let dom=document.getElementById('dom'+i).value;
    let ext=document.getElementById('ext'+i).value;
    let c1=parseFloat((document.getElementById('c1_'+i).value||"").replace(',','.'));
    let cx=parseFloat((document.getElementById('cx_'+i).value||"").replace(',','.'));
    let c2=parseFloat((document.getElementById('c2_'+i).value||"").replace(',','.'));
    if(c1 && cx && c2){
      let nom=(dom&&ext)? dom+" vs "+ext : "Match "+i;
      tableau.push({nom:nom,c1:c1,cX:cx,c2:c2});
    }
  }
  if(!tableau.length){ alert("Tape au moins 1 match : les 3 cotes. Ex: 1.38, 4.54, 8.60"); return; }
  genererTicketBamm(tableau);
}

function genererTicketBamm(tableau){
  dernierTableau=tableau;
  let analyses=[];
  tableau.forEach((m)=>{
    let c1=m.c1,cX=m.cX,c2=m.c2;
    let p1r=1/c1,pXr=1/cX,p2r=1/c2,s=p1r+pXr+p2r;
    let p1=Math.round(p1r/s*100),pX=Math.round(pXr/s*100),p2=Math.round(p2r/s*100);
    let maxP=Math.max(p1,pX,p2);
    let favori=p1===maxP?"1":(p2===maxP?"2":"X");
    let coteFav=favori==="1"?c1:(favori==="2"?c2:cX);
    let parties=m.nom.split(" vs "); let nomDom=parties[0]||"Domicile",nomExt=parties[1]||"Extérieur";
    let nomFav=favori==="1"?nomDom:nomExt;
    let confiance=maxP,risque=100-maxP;
    let choix="",coteChoix=0,probaChoix=0,type="",avert="";
    if(coteFav<1.35){ choix=`⚠️ PIÈGE - Ne joue PAS ${nomFav} seul @ ${coteFav}`; type="PIEGE"; probaChoix=maxP; avert=`Risque ${risque}% - Ex: Leeds 3-2 Man Blue à 1.17`; }
    else if(coteFav<=2.10){ choix=`Victoire ${nomFav} - SEC`; coteChoix=coteFav; probaChoix=maxP; type="SEC"; avert=`Risque ${risque}%`; }
    else { let coteDC=1/((maxP+pX)/100); choix=`Double Chance ${nomFav} ou Nul`; coteChoix=Math.round(coteDC*100)/100; probaChoix=maxP+pX; type="DC"; avert=`Risque ${100-probaChoix}%`; }
    analyses.push({nom:m.nom,c1,cX,c2,p1,pX,p2,favori,coteFav,confiance,risque,choix,coteChoix,probaChoix,type,avertissement:avert});
  });
  let bons=analyses.filter(a=>a.type!=="PIEGE").sort((a,b)=>b.confiance-a.confiance);
  let top3=bons.slice(0,3);
  let pieges=analyses.filter(a=>a.type==="PIEGE");
  let coteTotale=1; top3.forEach(a=>coteTotale*=a.coteChoix); coteTotale=Math.round(coteTotale*100)/100;
  let gain=Math.round(miseDefaut*coteTotale);
  let chanceCombinee=1; top3.forEach(a=>chanceCombinee*=(a.probaChoix/100)); chanceCombinee=Math.round(chanceCombinee*100);
  let confTicket=top3.length?Math.round(top3.reduce((s,a)=>s+a.confiance,0)/top3.length):0;
  document.getElementById('ticketBox').style.display='block';
  document.getElementById('btnCopy').style.display='block';
  document.getElementById('ticketList').innerHTML=top3.map((a,i)=>`<div class="ticket-row"><b>${i+1}. ${a.nom}</b><br><span style="color:#aaa;font-size:11px">Proba 1:${a.p1}% X:${a.pX}% 2:${a.p2}% - ${a.c1} / ${a.cX} / ${a.c2}</span><br><span>${a.choix} @ ${a.coteChoix}</span><br><span class="risque">⚠️ ${a.avertissement}</span></div>`).join("") + (pieges.length?`<div class="ticket-row" style="border:1px solid #ff1744"><b>🚫 PIÈGES À NE PAS JOUER SEUL :</b><br>${pieges.map(p=>`${p.nom} @ ${p.coteFav} - Risque ${p.risque}%`).join("<br>")}</div>`:"");
  document.getElementById('coteTotale').innerText="x "+coteTotale;
  document.getElementById('gainPotentiel').innerText=`Mise ${miseDefaut} MGA → Gain ${gain} MGA (Bénéfice ${gain-miseDefaut} MGA)`;
  document.getElementById('chanceCombinee').innerText=`🎯 Chance de gagner les 3 : ${chanceCombinee}%`;
  document.getElementById('ticketDetail').innerHTML=`<b>📊 Confiance = vraie proba.</b><br>${top3.map(a=>`• ${a.nom} : ${a.confiance}% - Risque ${a.risque}%`).join("<br>")}`;
  document.getElementById('tousMatchs').innerHTML=`<b>✅ Tous les matchs que tu as tapés :</b><br>${analyses.map(a=>`${a.type==="PIEGE"?"🚫":a.confiance>=55?"🟢":"🟡"} ${a.nom} - ${a.choix}`).join("<br>")}`;
  dernierTicketText=`TICKET V11 BAM - Cote x${coteTotale} - Gain ${gain} MGA - Chance ${chanceCombinee}%\n${top3.map((a,i)=>`${i+1}. ${a.nom} - ${a.choix} @ ${a.coteChoix}`).join("\n")}`;
  if(navigator.vibrate) navigator.vibrate([100,50,100]);
  document.getElementById('ticketBox').scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
</body>
</html>
