<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VIRTUEL V15 SIMPLE - QUI GAGNE ?</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial;padding:0;padding-bottom:20px;text-align:center}
.top{padding:16px;background:linear-gradient(180deg,#0a2a00,#000);border-bottom:2px solid #00c853;position:sticky;top:0;z-index:10}
.top h1{font-size:30px;margin:0;color:#00ff88}
.top p{color:#ffcc00;font-size:12px;margin:4px 0 0;font-weight:900}
.card{margin:12px;background:linear-gradient(180deg,#0a2a00,#0a0a0a);border:2px solid #00c853;border-radius:20px;padding:16px}
label{font-size:14px;color:#ffcc00;font-weight:900;display:block;margin:10px 0 8px}
input{width:100%;padding:16px;border-radius:12px;border:1px solid #444;background:#111;color:#fff;font-size:15px}
.preview{width:100%;border-radius:12px;margin-top:10px;display:none;border:1px solid #333;max-height:240px;object-fit:cover}
.status{font-size:13px;color:#aaa;margin-top:10px}
.reponse{background:#001a0a;border:3px solid #00ff88;border-radius:20px;padding:20px;margin-top:14px;display:none}
.reponse .match{font-size:16px;color:#aaa}
.reponse .gagnant{font-size:36px;font-weight:900;color:#00ff88;margin:10px 0;line-height:1.1}
.reponse .cotes{font-size:14px;color:#fff;background:#111;border-radius:10px;padding:10px;margin-top:10px}
.reponse .proba{font-size:13px;color:#ffcc00;margin-top:8px}
.reponse .piege{font-size:16px;color:#ff1744;font-weight:900}
.btn{width:100%;background:#00c853;color:#fff;padding:14px;border:0;border-radius:12px;font-weight:900;font-size:16px;margin-top:10px;display:none}
.small{font-size:11px;color:#aaa;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<div class="top">
<h1>⚡ QUI GAGNE ?</h1>
<p>CAPTURE → 1 RÉPONSE - C'EST TOUT</p>
</div>

<div class="card">
<label>📸 METS TA CAPTURE - 1 MATCH</label>
<input type="file" id="fileInput" accept="image/*" onchange="onFileChange(event)">
<img id="preview" class="preview">
<div class="status" id="autoText">Prêt ! Mets ta capture.</div>

<div class="reponse" id="reponseBox">
<div class="match" id="matchNom">-</div>
<div class="gagnant" id="gagnantText">-</div>
<div class="cotes" id="cotesText">-</div>
<div class="proba" id="probaText">-</div>
</div>
<button class="btn" id="btnReanalyse" onclick="relireCapture()">🔄 RE-ESSAYER AVEC LA MÊME CAPTURE</button>
</div>
<p class="small">Exemple : Tu mets Liverpool vs Spurs<br>Le robot te répond : <b style="color:#00ff88">Liverpool gagne</b><br><br>Tu coupes ta capture juste sur les 2 équipes + les 3 cotes vertes.<br>18+ Joue responsable.</p>

<script>
let derniereImageData=null;
function onFileChange(e){
  let f=e.target.files[0]; if(!f) return;
  document.getElementById('btnReanalyse').style.display='block';
  document.getElementById('reponseBox').style.display='none';
  document.getElementById('autoText').innerText='⚡ Je lis...';
  let r=new FileReader();
  r.onload=function(ev){ derniereImageData=ev.target.result; let p=document.getElementById('preview'); p.src=ev.target.result; p.style.display='block'; lireEtRepondre(ev.target.result); };
  r.readAsDataURL(f);
}
function relireCapture(){ if(!derniereImageData){alert("Mets d'abord ta capture !");return;} lireEtRepondre(derniereImageData); }
function agrandirImage(imgData){
  return new Promise((resolve)=>{
    let img=new Image();
    img.onload=function(){ let canvas=document.createElement('canvas'); let scale=2; canvas.width=img.width*scale; canvas.height=img.height*scale; let ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,canvas.width,canvas.height); resolve(canvas.toDataURL('image/jpeg',0.9)); };
    img.src=imgData;
  });
}
function corrigerNom(nomBrut){
  let b=nomBrut.toLowerCase().trim();
  let dico=[["manchester red","Manchester Red"],["man red","Manchester Red"],["manchester blue","Manchester Blue"],["man blue","Manchester Blue"],["london reds","London Reds"],["london blues","London Blues"],["liverpool","Liverpool"],["spurs","Spurs"],["tottenham","Spurs"],["wolverhampton","Wolverhampton"],["wolves","Wolverhampton"],["everton","Everton"],["west ham","West Ham"],["aston villa","A. Villa"],["a. villa","A. Villa"],["leeds","Leeds"],["bournemouth","Bournemouth"],["burnley","Burnley"],["sunderland","Sunderland"],["brighton","Brighton"],["crystal palace","C. Palace"],["c. palace","C. Palace"],["fulham","Fulham"],["newcastle","Newcastle"],["nottingham","N. Forest"],["n. forest","N. Forest"],["brentford","Brentford"],["chelsea","Chelsea"],["arsenal","Arsenal"]];
  for(let d of dico){ if(b.includes(d[0])) return d[1]; }
  return null;
}
async function lireEtRepondre(imgData){
  try{
    let grand=await agrandirImage(imgData);
    let form=new FormData(); form.append("base64Image", grand); form.append("language","eng"); form.append("isOverlayRequired","true"); form.append("scale","true"); form.append("OCREngine","2");
    let resp=await fetch("https://api.ocr.space/parse/image",{method:"POST",headers:{"apikey":"helloworld"},body:form});
    let data=await resp.json();
    let parsed=data && data.ParsedResults && data.ParsedResults[0] ? data.ParsedResults[0] : null;
    let texte=parsed? parsed.ParsedText||"" : "";
    let lignesOverlay=parsed && parsed.TextOverlay && parsed.TextOverlay.Lines ? parsed.TextOverlay.Lines : [];
    // On groupe par ligne (même hauteur = même match) pour ne pas mélanger les noms
    let lignes=[];
    lignesOverlay.forEach(l=>{
      let y=l.MinTop||0; let mots=l.Words.map(w=>w.WordText).join(" ");
      let exist=lignes.find(x=>Math.abs(x.y-y)<14);
      if(exist) exist.texte+=" "+mots;
      else lignes.push({y:y,texte:mots});
    });
    lignes.sort((a,b)=>a.y-b.y);
    // On prend la PREMIÈRE ligne qui a 2 équipes + 3 cotes = ton match
    let matchTrouve=null;
    for(let l of lignes){
      let cotes=(l.texte.match(/\d[.,]\d{2}/g)||[]).map(n=>parseFloat(n.replace(',','.'))).filter(v=>v>=1.01 && v<=20);
      if(cotes.length<3) continue;
      let bas=l.texte.toLowerCase();
      let dicoNoms=["manchester red","manchester blue","london reds","london blues","liverpool","spurs","tottenham","wolverhampton","wolves","everton","west ham","aston villa","a. villa","leeds","bournemouth","burnley","sunderland","brighton","crystal palace","c. palace","fulham","newcastle","nottingham","n. forest","brentford","chelsea","arsenal","man red","man blue"];
      let positions=[];
      dicoNoms.forEach(nom=>{ let idx=bas.indexOf(nom); if(idx!==-1) positions.push({pos:idx,nom:corrigerNom(nom)}); });
      positions.sort((a,b)=>a.pos-b.pos);
      let fil=[]; positions.forEach(p=>{ if(!fil.some(f=>Math.abs(f.pos-p.pos)<4)) fil.push(p); });
      if(fil.length>=2 && fil[0].nom!==fil[1].nom){ matchTrouve={dom:fil[0].nom,ext:fil[1].nom,c1:cotes[0],cx:cotes[1],c2:cotes[2]}; break; }
    }
    // Si l'overlay a raté, on prend les 3 premières cotes + les 2 premiers noms dans tout le texte
    if(!matchTrouve){
      let cotes=(texte.match(/\d[.,]\d{2}/g)||[]).map(n=>parseFloat(n.replace(',','.'))).filter(v=>v>=1.01 && v<=20);
      if(cotes.length>=3){
        // On cherche les noms dans l'ordre du texte, pas en colonne
        let bas=texte.toLowerCase();
        let dicoNoms=["manchester red","manchester blue","london reds","london blues","liverpool","spurs","tottenham","wolverhampton","wolves","everton","west ham","aston villa","a. villa","leeds","bournemouth","burnley","sunderland","brighton","crystal palace","c. palace","fulham","newcastle","nottingham","n. forest","brentford","chelsea","arsenal"];
        let positions=[]; dicoNoms.forEach(nom=>{ let idx=bas.indexOf(nom); if(idx!==-1) positions.push({pos:idx,nom:corrigerNom(nom)}); });
        positions.sort((a,b)=>a.pos-b.pos);
        if(positions.length>=2) matchTrouve={dom:positions[0].nom,ext:positions[1].nom,c1:cotes[0],cx:cotes[1],c2:cotes[2]};
      }
    }
    if(!matchTrouve){ document.getElementById('autoText').innerText='⚠️ Je n\'ai pas lu. Coupe juste les 2 équipes + les 3 cotes vertes et renvoie.'; return; }
    // CALCUL : Qui gagne ?
    let c1=matchTrouve.c1, cx=matchTrouve.cx, c2=matchTrouve.c2;
    let p1r=1/c1, pxr=1/cx, p2r=1/c2, s=p1r+pxr+p2r;
    let p1=Math.round(p1r/s*100), px=Math.round(pxr/s*100), p2=Math.round(p2r/s*100);
    let maxP=Math.max(p1,px,p2);
    let gagnant="", gagnantNom="", coteGagnant=0;
    if(p1===maxP){ gagnant="1"; gagnantNom=matchTrouve.dom; coteGagnant=c1; }
    else if(p2===maxP){ gagnant="2"; gagnantNom=matchTrouve.ext; coteGagnant=c2; }
    else { gagnant="X"; gagnantNom="Match Nul"; coteGagnant=cx; }
    document.getElementById('reponseBox').style.display='block';
    document.getElementById('matchNom').innerText=matchTrouve.dom+" vs "+matchTrouve.ext;
    if(coteGagnant<1.35){
      document.getElementById('gagnantText').innerHTML=`<span class="piege">⚠️ PIÈGE<br>Ne joue pas<br>${gagnantNom} seul</span>`;
      document.getElementById('probaText').innerText=`Cote trop basse @ ${coteGagnant} - Risque ${100-maxP}% - Ex: Man Blue 1.17 a perdu contre Leeds`;
    } else if(gagnant==="X"){
      document.getElementById('gagnantText').innerText=`🤝 MATCH NUL`;
      document.getElementById('probaText').innerText=`Proba Nul : ${px}% - Cote @ ${cx}`;
    } else {
      document.getElementById('gagnantText').innerText=`✅ ${gagnantNom.toUpperCase()} GAGNE`;
      document.getElementById('probaText').innerText=`Proba : ${maxP}% - Cote @ ${coteGagnant}`;
    }
    document.getElementById('cotesText').innerText=`${matchTrouve.dom} ${c1}  |  Nul ${cx}  |  ${matchTrouve.ext} ${c2}`;
    document.getElementById('autoText').innerText='✅ Réponse prête.';
    if(navigator.vibrate) navigator.vibrate([100,50,100]);
  }catch(e){ document.getElementById('autoText').innerText='⚠️ Pas de connexion. Vérifie ta 4G et réessaie.'; }
}
</script>
</body>
</html>
